<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Yasir Oladimeji</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #f7f7f7;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 4.5rem 4.5rem;
      pointer-events: none;
      z-index: 0;
    }

    .error-container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 28rem;
    }

    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #f7f7f7;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    .error-message {
      font-size: 1.1rem;
      color: #a3a3a3;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    .error-home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #f7f7f7;
      font-size: 0.92rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    .error-home-link:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-1px);
    }

    .error-home-link svg {
      width: 16px;
      height: 16px;
    }

    .error-footer {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.82rem;
      color: #555;
      z-index: 1;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
    }

    .error-footer a {
      color: #777;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(255,255,255,0.15);
      transition: color 0.2s;
    }

    .error-footer a:hover {
      color: #f7f7f7;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <p class="error-message">This page doesn't exist. It may have moved, or the URL has a typo.</p>
    <a class="error-home-link" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Back to home
    </a>
  </div>
  <div class="error-footer">
    <a href="/">yastec.vercel.app</a>
  </div>
</body>
</html>
