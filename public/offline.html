<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Yasir Oladimeji</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #f7f7f7;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .offline-container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 26rem;
    }

    .offline-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      color: #555;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    .offline-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .offline-message {
      font-size: 1rem;
      color: #a3a3a3;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    .offline-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #f7f7f7;
      font-size: 0.92rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    .offline-retry:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-1px);
    }

    .offline-retry svg {
      width: 16px;
      height: 16px;
    }

    .offline-footer {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.82rem;
      color: #444;
      z-index: 1;
      opacity: 0;
      animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    /* Pulsing dot to show the page is alive */
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      margin-right: 0.4rem;
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <svg class="offline-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.01 21.49 23.64 7a19.3 19.3 0 0 0-4.47-2.27"/>
      <path d="M4.83 4.78A19.36 19.36 0 0 0 .36 7l11.63 14.49.01-.01"/>
      <path d="m2 2 20 20"/>
      <path d="M8.28 9.05A12.7 12.7 0 0 0 5 11.76"/>
      <path d="M19 11.76a12.7 12.7 0 0 0-6.62-3.78"/>
      <path d="M9.66 14.53a6.2 6.2 0 0 1 4.68 0"/>
    </svg>

    <h1 class="offline-title">You're offline</h1>
    <p class="offline-message">Check your connection and try again. The page will load once you're back online.</p>
    <button class="offline-retry" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      Retry
    </button>
  </div>
  <div class="offline-footer">
    <span class="status-dot"></span> Waiting for connection
  </div>

  <script>
    // Auto-reload when the connection comes back
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
